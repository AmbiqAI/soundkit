<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NNSE | Monitor</title>
  <script src="https://unpkg.com/wavesurfer.js@7"></script>

  <style>
    :root { --bg: #0a0a0b; --w: #141417; --neon: #d8f41d; --red: #FF355E; --green: #00d28a; --text: #DAE3E3; }
    * { box-sizing: border-box; font-family: 'Roboto Mono', monospace; }
    body { color: var(--text); background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
    
    .dashboard { width: 900px; display: grid; grid-template-columns: 1fr; grid-gap: 15px; }
    
    .header-bar { background: var(--w); border: 1px solid #2a2a2e; padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; border-radius: 4px; }
    #pairButton { background: var(--neon); border: none; color: #000; font-weight: bold; padding: 8px 24px; border-radius: 4px; cursor: pointer; }
    
    .widget { background: var(--w); border: 1px solid #2a2a2e; padding: 20px; border-radius: 4px; display: flex; flex-direction: column; }
    
    .vis-grid { 
        display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto auto; 
        gap: 4px; background: #000; padding: 5px; border: 1px solid #333; 
    }
    .col-header { text-align: center; font-weight: bold; font-size: 12px; padding: 5px 0; text-transform: uppercase; letter-spacing: 1px; }
    .panel-container { position: relative; width: 100%; height: 100%; display: flex; justify-content: center; }
    canvas { width: 360px; height: 120px; background: #000; display: block; image-rendering: pixelated; border: 1px solid #222; }

    /* TEXT ONLY METRICS */
    .perf-metrics { 
        margin-top: 10px; padding: 15px; background: #000; font-size: 13px; color: #888; 
        display: flex; justify-content: space-between; align-items: center; border: 1px solid #333;
    }
    .metric-box { text-align: right; }
    .metric-val { font-weight: bold; color: #fff; font-size: 16px; margin-left: 5px; }

    .controls-row { display: flex; gap: 15px; margin-top: 15px; align-items: center; }
    .export-btn { flex: 1; background: var(--neon); color: #000; border: none; padding: 12px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 4px; }
    .recording { background: var(--red) !important; color: #fff !important; }

    #replayMenu { display: none; margin-top: 15px; padding: 15px; background: #1a1a1e; border: 1px solid #333; border-radius: 4px; }
    .replay-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .replay-btn { padding: 12px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 8px; background: #333; color: #fff; transition: 0.2s; }
    .replay-btn span { font-size: 18px; line-height: 1; }
    .replay-btn:hover { background: #444; }
    .replay-btn.raw { border-bottom: 3px solid var(--red); }
    .replay-btn.enh { border-bottom: 3px solid var(--green); }
    .replay-btn.dl { background: var(--neon); color: #000; }

    .gain-container { flex: 2; display: flex; flex-direction: column; gap: 5px; background: #000; padding: 10px; border-radius: 4px; border: 1px solid #333; }
    .gain-label { font-size: 10px; color: #888; display: flex; justify-content: space-between; }
    input[type=range] { width: 100%; accent-color: var(--neon); cursor: pointer; }
    audio { width: 100%; filter: invert(100%); }

    /* MODAL */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 1000; justify-content: center; align-items: center; backdrop-filter: blur(5px); }
    .modal-content { background: #141417; border: 1px solid #444; width: 800px; padding: 25px; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); display: flex; flex-direction: column; gap: 20px; }
    .modal-header { font-size: 18px; font-weight: bold; text-transform: uppercase; display: flex; justify-content: space-between; }
    #waveContainer { width: 100%; height: 150px; background: #000; border: 1px solid #333; border-radius: 4px; }
    .modal-controls { display: flex; justify-content: center; gap: 20px; }
    .close-btn { background: transparent; border: 1px solid #666; color: #888; padding: 5px 15px; cursor: pointer; border-radius: 4px; }
    .close-btn:hover { color: #fff; border-color: #fff; }

    /* OFFLINE SECTION CSS */
    .file-select { background: #000; color: var(--neon); border: 1px solid #333; padding: 8px; border-radius: 4px; font-family: 'Roboto Mono'; width: 300px; text-transform: uppercase; cursor: pointer; }
    .folder-btn { background: #333; color: #fff; border: 1px solid #555; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; font-family: 'Roboto Mono'; transition: 0.2s; }
    .folder-btn:hover { background: #444; border-color: var(--neon); color: var(--neon); }

    .offline-vis-container {
        display: flex; flex-direction: column; gap: 10px; margin-top: 15px;
    }
    .wave-wrapper {
        background: #000; border: 1px solid #333; border-radius: 4px; position: relative;
        padding: 5px;
    }
    .wave-label {
        position: absolute; top: 5px; left: 5px; font-size: 10px; font-weight: bold; 
        padding: 2px 6px; z-index: 10;
    }
    .loading-overlay {
        position: absolute; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.7);
        display: none; justify-content: center; align-items: center; color: var(--neon); z-index: 20;
    }
</style>
</head>
<body>

    <div class="dashboard">
        <header class="header-bar">
            <div style="color: var(--neon); font-weight: bold;">NNSE Monitor</div>
            <div id="status">DISCONNECTED</div>
            <button id="pairButton">CONNECT USB</button>
        </header>

        <div class="widget">
            <div class="vis-grid">
                <div class="col-header" style="color:var(--red)">RAW</div>
                <div class="col-header" style="color:var(--green)">ENHANCED</div>
                <div class="panel-container"><canvas id="waveRaw" width="360" height="120"></canvas></div>
                <div class="panel-container"><canvas id="waveEnh" width="360" height="120"></canvas></div>
                <div class="panel-container"><canvas id="specRaw" width="360" height="120"></canvas></div>
                <div class="panel-container"><canvas id="specEnh" width="360" height="120"></canvas></div>
            </div>
            
            <div class="perf-metrics">
                <div>Queue Lag: <span id="qLag" class="metric-val" style="color:var(--neon)">0</span></div>
                
                <div class="metric-box">
                    <span>AI Latency:</span> 
                    <span id="aiLat" class="metric-val" style="color:var(--green)">0</span> us
                </div>

                <div class="metric-box">
                    <span>AI Load (10ms):</span> 
                    <span id="aiLoad" class="metric-val" style="color:var(--text)">0%</span>
                </div>
            </div>

            <div class="controls-row">
                <div class="gain-container">
                    <div class="gain-label"><span>DIGITAL GAIN</span><span id="gainVal" style="color:var(--neon); font-weight:bold;">+10 dB</span></div>
                    <input type="range" id="gainSlider" min="-20" max="40" value="10" step="1">
                </div>
                <button id="recordBtn" class="export-btn">Start Recording</button>
            </div>

            <div id="replayMenu">
                <div class="replay-grid">
                    <button id="playRawBtn" class="replay-btn raw"><span>&#9658;</span> REPLAY RAW</button>
                    <button id="playEnhBtn" class="replay-btn enh"><span>&#9658;</span> REPLAY ENHANCED</button>
                    <button id="dlBtn" class="replay-btn dl"><span>&#11015;</span> DOWNLOAD STEREO</button>
                </div>
            </div>
            
            <audio controls id="monitor" style="display:none"></audio>
        </div>
    </div>

    <div class="dashboard">
        <header class="header-bar">
            <div style="display:flex; align-items:center; gap:15px;">
                <div style="color: var(--neon); font-weight: bold;">OFFLINE</div>
                <button id="scanBtn" class="folder-btn">SCAN FOLDER</button>
            </div>
            
            <select id="sampleSelect" class="file-select" disabled>
                <option value="" disabled selected>NO FOLDER SCANNED</option>
            </select>
        </header>

        <div class="widget">
            <div class="offline-vis-container">
                <div class="wave-wrapper" style="border-left: 3px solid var(--red);">
                    <div class="wave-label" style="background: var(--red); color: #fff;">RAW (CH 2)</div>
                    <div id="offWaveRaw"></div>
                    <div id="loaderRaw" class="loading-overlay">LOADING...</div>
                </div>

                <div class="wave-wrapper" style="border-left: 3px solid var(--green);">
                    <div class="wave-label" style="background: var(--green); color: #000;">ENHANCED (CH 1)</div>
                    <div id="offWaveEnh"></div>
                    <div id="loaderEnh" class="loading-overlay">LOADING...</div>
                </div>
            </div>

            <div class="controls-row" style="margin-top:20px;">
                <button id="offPlayRaw" class="replay-btn raw" disabled>PLAY RAW</button>
                <button id="offPlayEnh" class="replay-btn enh" disabled>PLAY ENHANCED</button>
                <button id="offStop" class="replay-btn" disabled>STOP</button>
            </div>
        </div>
    </div>

    <div id="waveModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalTitle">REPLAY</span>
                <button class="close-btn" onclick="closeModal()">CLOSE</button>
            </div>
            <div id="waveContainer"></div>
            <div class="modal-controls">
                <button id="modalPlayBtn" class="export-btn" style="width: 150px;">PLAY / PAUSE</button>
            </div>
        </div>
    </div>

    <script src="serial.js"></script>
    <script>
        const audioWorker = new Worker('worker.js');
        const SAMPLE_RATE = 16000; 
        const TOTAL_SAMPLES = SAMPLE_RATE * 7.2; 
        const PACKET_SIZE_AUDIO = 1283; 
        const PACKET_SIZE_LATENCY = 7; 

        // Init Menu
        const replayMenu = document.getElementById('replayMenu');
        replayMenu.style.display = 'none';

        // Buffers & State
        let ringBufferL = new Float32Array(Math.ceil(TOTAL_SAMPLES));
        let ringBufferR = new Float32Array(Math.ceil(TOTAL_SAMPLES));
        let writePtr = 0;
        let isRecording = false;
        let rxBuffer = new Uint8Array(8192); 
        let rxPtr = 0;
        let queueRaw = [];
        let queueEnh = [];

        // CHANGED: Initialize Gain to 10dB
        let currentGainDB = 10;
        let currentGainFactor = Math.pow(10, currentGainDB / 20.0);

        let urlStereo = null;
        let urlRaw = null;
        let urlEnh = null;

        // FFT Setup
        const SPEC_FFT_SIZE = 512;
        let fftReal = new Float32Array(SPEC_FFT_SIZE), fftImag = new Float32Array(SPEC_FFT_SIZE);
        let windowTable = new Float32Array(SPEC_FFT_SIZE), bitReverse = new Uint16Array(SPEC_FFT_SIZE);
        let sinTable = new Float32Array(SPEC_FFT_SIZE), cosTable = new Float32Array(SPEC_FFT_SIZE);
        for(let i=0; i<SPEC_FFT_SIZE; i++) {
            windowTable[i] = 0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (SPEC_FFT_SIZE - 1));
            sinTable[i] = Math.sin(-2 * Math.PI * i / SPEC_FFT_SIZE);
            cosTable[i] = Math.cos(-2 * Math.PI * i / SPEC_FFT_SIZE);
            let m = Math.log2(SPEC_FFT_SIZE), n = i, r = 0;
            for(let j=0; j<m; j++) { r = (r << 1) | (n & 1); n >>= 1; }
            bitReverse[i] = r;
        }

        const cWaveRaw = document.getElementById('waveRaw').getContext('2d');
        const cWaveEnh = document.getElementById('waveEnh').getContext('2d');
        const cSpecRaw = document.getElementById('specRaw').getContext('2d', { willReadFrequently: true });
        const cSpecEnh = document.getElementById('specEnh').getContext('2d', { willReadFrequently: true });
        const tSpecRaw = document.createElement('canvas'); tSpecRaw.width = 360; tSpecRaw.height = 120;
        const ctxTRaw = tSpecRaw.getContext('2d');
        const tSpecEnh = document.createElement('canvas'); tSpecEnh.width = 360; tSpecEnh.height = 120;
        const ctxTEnh = tSpecEnh.getContext('2d');
        const colorMap = new Uint8ClampedArray(256 * 4);

        function createGradient() {
            const stops = [{ pos: 0.00, hex: "#000004" }, { pos: 0.16, hex: "#160b39" }, { pos: 0.33, hex: "#420a68" }, { pos: 0.50, hex: "#932667" }, { pos: 0.67, hex: "#dd513a" }, { pos: 0.84, hex: "#fca50a" }, { pos: 1.00, hex: "#fcffa4" }];
            const hexToRgb = (hex) => [parseInt(hex.slice(1,3),16), parseInt(hex.slice(3,5),16), parseInt(hex.slice(5,7),16)];
            stops.forEach(s => s.rgb = hexToRgb(s.hex));
            for (let i = 0; i < 256; i++) {
                let t = i / 255;
                let s1 = stops[0], s2 = stops[stops.length - 1];
                for (let j = 0; j < stops.length - 1; j++) { if (t >= stops[j].pos && t <= stops[j+1].pos) { s1 = stops[j]; s2 = stops[j+1]; break; } }
                const localT = (t - s1.pos) / (s2.pos - s1.pos);
                for(let c=0; c<3; c++) colorMap[i*4+c] = Math.floor(s1.rgb[c] + (s2.rgb[c] - s1.rgb[c]) * localT);
                colorMap[i*4+3] = 255;
            }
        }
        createGradient();

        const generator = new MediaStreamTrackGenerator({ kind: 'audio' });
        const audioWriter = generator.writable.getWriter();
        document.getElementById('monitor').srcObject = new MediaStream([generator]);
        let audioTime = 0;

        document.getElementById('gainSlider').addEventListener('input', (e) => {
            currentGainDB = parseInt(e.target.value);
            currentGainFactor = Math.pow(10, currentGainDB / 20.0);
            const sign = currentGainDB > 0 ? '+' : '';
            document.getElementById('gainVal').innerText = `${sign}${currentGainDB} dB`;
        });

        function processPacket(dataView) {
            const type = dataView.getUint8(0);

            if (type === 0x4) { 
                const samplesPerFrame = 320; 
                const leftCh = new Float32Array(samplesPerFrame);
                const rightCh = new Float32Array(samplesPerFrame);
                const byteOffset = 3; 

                for (let i = 0; i < samplesPerFrame; i++) {
                    const rawL = dataView.getInt16(byteOffset + (i * 4), true);
                    const rawR = dataView.getInt16(byteOffset + (i * 4) + 2, true);
                    leftCh[i] = (rawL / 32768.0) * currentGainFactor;
                    rightCh[i] = (rawR / 32768.0) * currentGainFactor;
                }

                const bufSize = ringBufferL.length;
                for (let i = 0; i < samplesPerFrame; i++) {
                    let idx = (writePtr + i) % bufSize;
                    ringBufferL[idx] = leftCh[i];
                    ringBufferR[idx] = rightCh[i];
                }
                writePtr = (writePtr + samplesPerFrame) % bufSize;
                
                queueRaw.push(leftCh);
                queueEnh.push(rightCh);

                if(isRecording) audioWorker.postMessage({ type: 'PROCESS_CHUNK', payload: { left: leftCh, right: rightCh } });

                const planar = new Float32Array(samplesPerFrame * 2);
                planar.set(leftCh, 0);
                planar.set(rightCh, samplesPerFrame);
                audioWriter.write(new AudioData({
                    format: "f32-planar", sampleRate: SAMPLE_RATE, numberOfChannels: 2,
                    numberOfFrames: samplesPerFrame, timestamp: audioTime * 1000000, data: planar
                })).catch(e=>{});
                audioTime += samplesPerFrame / SAMPLE_RATE;

            } else if (type === 0x2 || type === 0x3) { 
                if (dataView.byteLength >= 7) {
                    const lat = dataView.getUint32(3, true); 
                    
                    if (lat > 0 && lat < 1000000) {
                        document.getElementById('aiLat').innerText = lat;
                        const percent = (lat / 10000.0) * 100;
                        const elLoad = document.getElementById('aiLoad');
                        elLoad.innerText = percent.toFixed(1) + "%";
                        if (percent > 100) elLoad.style.color = "var(--red)";
                        else elLoad.style.color = "var(--text)";
                    }
                }
            }
        }

        function handleIncomingChunk(dataView) {
            const newBytes = new Uint8Array(dataView.buffer, dataView.byteOffset, dataView.byteLength);
            if (rxPtr + newBytes.length > rxBuffer.length) rxPtr = 0; 
            rxBuffer.set(newBytes, rxPtr);
            rxPtr += newBytes.length;

            let processed = true;
            while (processed && rxPtr > 0) {
                processed = false;
                const type = rxBuffer[0];
                let needed = 0;

                if (type === 0x4) needed = PACKET_SIZE_AUDIO;      
                else if (type === 0x2) needed = PACKET_SIZE_LATENCY; 
                else if (type === 0x3) needed = PACKET_SIZE_LATENCY; 
                else if (type === 0x1) needed = 5; 

                if (needed > 0 && rxPtr >= needed) {
                    const packet = rxBuffer.slice(0, needed);
                    const view = new DataView(packet.buffer);
                    processPacket(view);
                    rxBuffer.set(rxBuffer.subarray(needed, rxPtr), 0);
                    rxPtr -= needed;
                    processed = true;
                } else if (needed === 0) {
                    rxBuffer.set(rxBuffer.subarray(1, rxPtr), 0);
                    rxPtr--;
                }
            }
        }

        function renderLoop() {
            if (queueEnh.length > 20) {
                const drop = queueEnh.length - 20;
                queueRaw.splice(0, drop);
                queueEnh.splice(0, drop);
            }

            let processed = 0;
            const maxPerFrame = 5; 
            while(queueEnh.length > 0 && processed < maxPerFrame) {
                drawSpectrogram(cSpecRaw, ctxTRaw, queueRaw.shift());
                drawSpectrogram(cSpecEnh, ctxTEnh, queueEnh.shift());
                processed++;
            }
            document.getElementById('qLag').innerText = queueEnh.length;
            
            drawWaveform(cWaveRaw, ringBufferL, '#FF355E');
            drawWaveform(cWaveEnh, ringBufferR, '#00d28a');

            requestAnimationFrame(renderLoop);
        }
        renderLoop();

        function drawWaveform(ctx, buffer, color) {
            const w = ctx.canvas.width; 
            const h = ctx.canvas.height; 
            const halfH = h / 2;

            ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
            ctx.strokeStyle = '#222'; ctx.beginPath(); ctx.moveTo(0, halfH); ctx.lineTo(w, halfH); ctx.stroke();
            ctx.strokeStyle = color;
            ctx.beginPath();

            const bufSize = buffer.length;
            const step = Math.floor(bufSize / w); 
            
            for (let x = 0; x < w; x++) {
                let start = (writePtr + (x * step)) % bufSize;
                let min = 1, max = -1;
                for (let j = 0; j < step; j+=16) { 
                    let s = buffer[(start + j) % bufSize]; 
                    if (s < min) min = s; 
                    if (s > max) max = s; 
                }
                let yMin = halfH + (min * halfH);
                let yMax = halfH + (max * halfH);
                ctx.moveTo(x, yMin); ctx.lineTo(x, yMax);
            }
            ctx.stroke();
        }

        function drawSpectrogram(targetCtx, tempCtxHelper, chunk) {
            const canvas = targetCtx.canvas;
            tempCtxHelper.drawImage(canvas, 0, 0); 
            targetCtx.drawImage(tempCtxHelper.canvas, -1, 0); 
            
            for(let i=0; i<SPEC_FFT_SIZE; i++) {
                let rIdx = bitReverse[i]; fftReal[i] = (chunk[rIdx] || 0) * windowTable[rIdx]; fftImag[i] = 0;
            }
            for (let s = 2; s <= SPEC_FFT_SIZE; s *= 2) {
                let half = s / 2, step = SPEC_FFT_SIZE / s;
                for (let i = 0; i < SPEC_FFT_SIZE; i += s) {
                    for (let j = 0; j < half; j++) {
                        let k = j * step;
                        let tR = fftReal[i+j+half]*cosTable[k] - fftImag[i+j+half]*sinTable[k];
                        let tI = fftReal[i+j+half]*sinTable[k] + fftImag[i+j+half]*cosTable[k];
                        fftReal[i+j+half] = fftReal[i+j] - tR; fftImag[i+j+half] = fftImag[i+j] - tI;
                        fftReal[i+j] += tR; fftImag[i+j] += tI;
                    }
                }
            }
            const mags = new Float32Array(SPEC_FFT_SIZE / 2);
            for(let i=0; i<SPEC_FFT_SIZE/2; i++) mags[i] = Math.sqrt(fftReal[i]**2 + fftImag[i]**2);

            const h = canvas.height;
            const bins = Math.floor(8000 * SPEC_FFT_SIZE / SAMPLE_RATE); 
            const imgData = targetCtx.createImageData(1, h);
            
            for (let y = 0; y < h; y++) {
                const bIdx = Math.floor((1 - (y / h)) * bins);
                let db = 20 * Math.log10(mags[bIdx] + 1e-6);
                let norm = Math.max(0, Math.min(1, (db + 80) / 90));
                const cIdx = Math.floor(norm * 255);
                imgData.data[y*4] = colorMap[cIdx*4]; imgData.data[y*4+1] = colorMap[cIdx*4+1]; imgData.data[y*4+2] = colorMap[cIdx*4+2]; imgData.data[y*4+3] = 255;
            }
            targetCtx.putImageData(imgData, canvas.width - 1, 0);
        }

        document.getElementById('pairButton').onclick = () => {
            if(!window.serial) return alert("Web Serial Not Found");
            serial.requestPort().then(p => p.connect().then(() => {
                document.getElementById('status').innerText = "CONNECTED";
                document.getElementById('pairButton').style.background = "#FF355E";
                p.onReceive = handleIncomingChunk; 
            }));
        };

        const recBtn = document.getElementById('recordBtn');

        recBtn.onclick = () => {
            if (!isRecording) { 
                audioWorker.postMessage({ type: 'START_RECORDING' }); 
                isRecording = true; 
                recBtn.innerText = "STOP RECORDING"; 
                recBtn.classList.add('recording');
                replayMenu.style.display = 'none'; 
            } else { 
                audioWorker.postMessage({ type: 'GENERATE_WAV' }); 
                isRecording = false; 
                recBtn.innerText = "START RECORDING"; 
                recBtn.classList.remove('recording'); 
            }
        };

        audioWorker.onmessage = (e) => {
            if (e.data.type === 'WAV_RESULT') {
                if(e.data.stereo.size < 1000) return; 

                if(urlStereo) URL.revokeObjectURL(urlStereo);
                if(urlRaw) URL.revokeObjectURL(urlRaw);
                if(urlEnh) URL.revokeObjectURL(urlEnh);

                urlStereo = URL.createObjectURL(e.data.stereo);
                urlRaw = URL.createObjectURL(e.data.monoL);
                urlEnh = URL.createObjectURL(e.data.monoR);

                replayMenu.style.display = 'block'; 
            }
        };

        let wsInstance = null;
        const modal = document.getElementById('waveModal');
        const modalTitle = document.getElementById('modalTitle');

        function openModal(url, title, color) {
            modal.style.display = 'flex';
            modalTitle.innerText = title;
            modalTitle.style.color = color;

            if (wsInstance) {
                wsInstance.destroy();
            }

            wsInstance = WaveSurfer.create({
                container: '#waveContainer',
                waveColor: color,
                progressColor: '#fff',
                url: url,
                height: 150,
                barWidth: 2,
                cursorColor: '#fff'
            });

            wsInstance.on('ready', () => {
                wsInstance.play();
            });
        }

        window.closeModal = () => {
            modal.style.display = 'none';
            if (wsInstance) {
                wsInstance.pause();
            }
        };

        document.getElementById('playRawBtn').onclick = () => {
            if(urlRaw) openModal(urlRaw, "RAW AUDIO REPLAY", "#FF355E");
        };

        document.getElementById('playEnhBtn').onclick = () => {
            if(urlEnh) openModal(urlEnh, "ENHANCED AUDIO REPLAY", "#00d28a");
        };

        document.getElementById('modalPlayBtn').onclick = () => {
            if(wsInstance) wsInstance.playPause();
        };

        document.getElementById('dlBtn').onclick = () => {
            const a = document.createElement('a'); 
            a.href = urlStereo; 
            a.download = `NNSE_Capture_${Date.now()}.wav`; 
            a.click();
        };

        // ==========================================
        // OFFLINE ANALYSIS LOGIC (FOLDER SCANNER)
        // ==========================================

        const scanBtn = document.getElementById('scanBtn');
        const selectEl = document.getElementById('sampleSelect');
        let directoryHandle = null;

        scanBtn.onclick = async () => {
            try {
                directoryHandle = await window.showDirectoryPicker();
                selectEl.innerHTML = '<option value="" disabled selected>SELECT A FILE...</option>';
                let count = 0;
                for await (const entry of directoryHandle.values()) {
                    if (entry.kind === 'file' && entry.name.toLowerCase().endsWith('.wav')) {
                        const opt = document.createElement('option');
                        opt.value = entry.name; 
                        opt.innerText = entry.name;
                        selectEl.appendChild(opt);
                        count++;
                    }
                }
                if(count > 0) {
                    selectEl.disabled = false;
                    scanBtn.innerText = "FOLDER SCANNED (" + count + ")";
                    scanBtn.style.borderColor = "var(--neon)";
                    scanBtn.style.color = "var(--neon)";
                } else {
                    alert("No .wav files found in that folder.");
                }
            } catch (err) { console.error(err); }
        };

        let wsOfflineRaw = null;
        let wsOfflineEnh = null;
        let isOfflinePlaying = false;
        
        // GLOBAL AUDIO CONTEXT (Re-use to prevent 6 context limit crash)
        let globalAudioCtx = null;
        function getAudioContext() {
            if (!globalAudioCtx) {
                globalAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (globalAudioCtx.state === 'suspended') {
                globalAudioCtx.resume();
            }
            return globalAudioCtx;
        }

        function initOfflinePlayers() {
            const commonOpts = {
                height: 100, barWidth: 2, cursorColor: '#fff', progressColor: '#fff', interact: true, normalize: true
            };

            // wsOfflineRaw = Red Box = Raw Channel (2)
            wsOfflineRaw = WaveSurfer.create({
                container: '#offWaveRaw',
                waveColor: '#FF355E', 
                ...commonOpts
            });

            // wsOfflineEnh = Green Box = Enh Channel (1)
            wsOfflineEnh = WaveSurfer.create({
                container: '#offWaveEnh',
                waveColor: '#00d28a', 
                ...commonOpts
            });

            // INDEPENDENT PLAYBACK: No syncing logic here anymore.
            // Players move independently.

            [wsOfflineRaw, wsOfflineEnh].forEach(ws => {
                ws.on('finish', () => { isOfflinePlaying = false; });
            });
        }

        initOfflinePlayers();

        function bufferToWav(abuffer, len) {
            let numOfChan = abuffer.numberOfChannels,
            length = len * numOfChan * 2 + 44,
            buffer = new ArrayBuffer(length),
            view = new DataView(buffer),
            channels = [], i, sample, offset = 0, pos = 0;

            setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157); setUint32(0x20746d66); 
            setUint32(16); setUint16(1); setUint16(numOfChan); setUint32(abuffer.sampleRate);
            setUint32(abuffer.sampleRate * 2 * numOfChan); setUint16(numOfChan * 2); setUint16(16);
            setUint32(0x61746164); setUint32(length - pos - 4);

            for(i = 0; i < abuffer.numberOfChannels; i++) channels.push(abuffer.getChannelData(i));

            while(pos < len) {
                for(i = 0; i < numOfChan; i++) {
                    sample = Math.max(-1, Math.min(1, channels[i][pos])); 
                    sample = (0.5 + sample < 0 ? sample * 32768 : sample * 32767)|0; 
                    view.setInt16(44 + offset, sample, true);
                    offset += 2;
                }
                pos++;
            }
            return new Blob([buffer], {type: "audio/wav"});
            function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
            function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }
        }

        selectEl.addEventListener('change', async (e) => {
            if(!directoryHandle) return;
            const filename = e.target.value;

            document.getElementById('loaderRaw').style.display = 'flex';
            document.getElementById('loaderEnh').style.display = 'flex';
            document.getElementById('offPlayRaw').disabled = true;
            document.getElementById('offPlayEnh').disabled = true;
            document.getElementById('offStop').disabled = true;

            try {
                const fileHandle = await directoryHandle.getFileHandle(filename);
                const file = await fileHandle.getFile();
                const arrayBuffer = await file.arrayBuffer();
                
                const audioCtx = getAudioContext(); // Use global reusable context
                const decodedBuffer = await audioCtx.decodeAudioData(arrayBuffer);
                
                if(decodedBuffer.numberOfChannels < 2) {
                    throw new Error(`File only has ${decodedBuffer.numberOfChannels} channels. 3-channel WAV required.`);
                }

                // CHANNEL MAPPING:
                // Channel 1 (Index 0) = ENHANCED
                // Channel 2 (Index 1) = RAW
                // Channel 3 (Index 2) = Ignored
                const enhData = decodedBuffer.getChannelData(0); 
                const rawData = decodedBuffer.getChannelData(1); 

                const enhMono = audioCtx.createBuffer(1, enhData.length, decodedBuffer.sampleRate);
                enhMono.copyToChannel(enhData, 0);

                const rawMono = audioCtx.createBuffer(1, rawData.length, decodedBuffer.sampleRate);
                rawMono.copyToChannel(rawData, 0);

                const enhBlob = bufferToWav(enhMono, enhData.length);
                const rawBlob = bufferToWav(rawMono, rawData.length);
                
                const enhUrl = URL.createObjectURL(enhBlob);
                const rawUrl = URL.createObjectURL(rawBlob);

                // Load to correct players
                // wsOfflineRaw = Red Box = Raw Channel
                // wsOfflineEnh = Green Box = Enh Channel
                await Promise.all([
                    wsOfflineRaw.load(rawUrl),
                    wsOfflineEnh.load(enhUrl)
                ]);

                // Reset volumes to ensure no bleeding
                wsOfflineRaw.setVolume(1.0);
                wsOfflineEnh.setVolume(1.0);

                document.getElementById('offPlayRaw').disabled = false;
                document.getElementById('offPlayEnh').disabled = false;
                document.getElementById('offStop').disabled = false;

            } catch(err) {
                alert("Error loading file: " + err.message);
            } finally {
                document.getElementById('loaderRaw').style.display = 'none';
                document.getElementById('loaderEnh').style.display = 'none';
            }
        });

        const btnOffPlayRaw = document.getElementById('offPlayRaw');
        const btnOffPlayEnh = document.getElementById('offPlayEnh');
        const btnOffStop = document.getElementById('offStop');

        // Play RAW ONLY (Channel 2)
        btnOffPlayRaw.onclick = () => {
            getAudioContext().resume();
            
            // Stop the other player
            wsOfflineEnh.pause();
            
            // Play this one
            wsOfflineRaw.play();
        };

        // Play ENH ONLY (Channel 1)
        btnOffPlayEnh.onclick = () => {
            getAudioContext().resume();
            
            // Stop the other player
            wsOfflineRaw.pause();
            
            // Play this one
            wsOfflineEnh.play();
        };

        btnOffStop.onclick = () => {
            wsOfflineRaw.pause();
            wsOfflineEnh.pause();
            wsOfflineRaw.seekTo(0);
            wsOfflineEnh.seekTo(0);
        };

    </script>
</body>
</html>
