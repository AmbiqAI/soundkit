<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>NNSE | Monitor</title>
  <script src="https://unpkg.com/wavesurfer.js@7"></script>

  <style>
    :root { --bg: #0a0a0b; --w: #141417; --neon: #d8f41d; --red: #FF355E; --green: #00d28a; --blue: #00f0ff; --text: #DAE3E3; }
    * { box-sizing: border-box; font-family: 'Roboto Mono', monospace; }
    body { color: var(--text); background: var(--bg); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 30px; }
    
    .dashboard { width: 950px; display: grid; grid-template-columns: 1fr; grid-gap: 15px; }
    .header-bar { background: var(--w); border: 1px solid #2a2a2e; padding: 15px 25px; display: flex; align-items: center; justify-content: space-between; border-radius: 4px; }
    #pairButton { background: var(--neon); border: none; color: #000; font-weight: bold; padding: 8px 24px; border-radius: 4px; cursor: pointer; }
    
    .widget { background: var(--w); border: 1px solid #2a2a2e; padding: 20px; border-radius: 4px; display: flex; flex-direction: column; }
    
    /* Score Grid & Flash Animation */
    .score-grid { display: none; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 15px; padding: 15px; background: #080808; border: 1px solid #333; border-radius: 4px; text-align: center; }
    .score-box { display: flex; flex-direction: column; gap: 4px; padding: 8px; border: 1px solid #222; border-radius: 4px; transition: all 0.2s; }
    
    .is-triggering { 
        border-color: var(--red) !important; 
        background: rgba(255, 53, 94, 0.2) !important; 
        animation: trigger-flash 0.5s infinite alternate;
    }
    @keyframes trigger-flash { from { opacity: 1; } to { opacity: 0.6; } }

    .trigger-badge { background: var(--red); color: white; font-size: 10px; padding: 2px; border-radius: 2px; font-weight: bold; margin-top: 4px; }
    .score-id { font-size: 10px; color: #666; }
    .score-name { font-size: 12px; font-weight: bold; color: #fff; overflow: hidden; text-overflow: ellipsis; }
    .score-val { font-size: 16px; font-weight: bold; }

    /* UI Components */
    .vis-grid { display: grid; grid-template-columns: 1fr; gap: 8px; background: #000; padding: 8px; border: 1px solid #333; margin-bottom: 15px; }
    canvas { width: 100%; height: 120px; background: #000; display: block; border: 1px solid #222; }
    .perf-metrics { margin-top: 10px; padding: 15px; background: #000; font-size: 13px; color: #888; display: flex; justify-content: space-between; border: 1px solid #333; }
    .metric-val { font-weight: bold; color: #fff; font-size: 16px; margin-left: 5px; }
    
    .controls-row { display: flex; gap: 10px; margin-top: 15px; align-items: stretch; width: 100%; height: 60px; }
    
    /* SLIDER CONTAINERS */
    .gain-container { 
        flex: 1.5; 
        min-width: 160px;
        display: flex; 
        flex-direction: column; 
        justify-content: center;
        gap: 5px; 
        background: #000; 
        padding: 8px 12px; 
        border-radius: 4px; 
        border: 1px solid #333; 
    }
    .gain-label { font-size: 9px; color: #888; display: flex; justify-content: space-between; text-transform: uppercase; }
    
    input[type=range] { width: 100%; cursor: pointer; margin: 0; }
    #gainSlider { accent-color: var(--neon); }
    #threshSlider { accent-color: var(--blue); }

    .btn { border: none; padding: 0 10px; cursor: pointer; font-weight: bold; text-transform: uppercase; border-radius: 4px; flex: 1; font-size: 11px; }
    .enroll-btn { background: var(--text); color: #000; }
    .test-btn { background: #333; color: var(--blue); border: 1px solid var(--blue); }
    .stop-btn { background: #333; color: #fff; border: 1px solid #555; }
    .export-btn { background: var(--neon); color: #000; }
    
    .recording { background: var(--red) !important; color: #fff !important; }
    .enrolling { background: var(--green) !important; color: #000 !important;}
    .testing { background: var(--blue) !important; color: #000 !important; }
    
    .name-input { width: 100px; padding: 0 10px; background: #000; border: 1px solid #333; color: #fff; border-radius: 4px; font-weight: bold; }
  </style>
</head>
<body>

    <div class="dashboard">
        <header class="header-bar">
            <div style="color: var(--neon); font-weight: bold;">Speech Detection Monitor</div>
            <div id="status">DISCONNECTED</div>
            <button id="pairButton">CONNECT USB</button>
        </header>

        <div class="widget">
            <div class="vis-grid">
                <canvas id="waveRaw"></canvas>
                <canvas id="waveEnh"></canvas>
            </div>
            
            <div class="perf-metrics">
                <div>Queue Lag: <span id="qLag" class="metric-val" style="color:var(--neon)">0</span></div>
                <div>Utterances: <span id="enrollCount" class="metric-val" style="color:var(--blue)">0</span>/4</div>
                <div>AI Latency: <span id="aiLat" class="metric-val" style="color:var(--green)">0</span> us</div>
                <div>AI Load: <span id="aiLoad" class="metric-val">0%</span></div>
            </div>

            <div class="controls-row">
                <div class="gain-container">
                    <div class="gain-label"><span>Gain</span><span id="gainVal" style="color:var(--neon)">+10 dB</span></div>
                    <input type="range" id="gainSlider" min="-20" max="40" value="10">
                </div>

                <div class="gain-container" style="border-color: var(--blue);">
                    <div class="gain-label"><span>ID Threshold</span><span id="threshVal" style="color:var(--blue)">0.80</span></div>
                    <input type="range" id="threshSlider" min="0" max="100" value="80">
                </div>
                
                <input type="text" id="enrollName" class="name-input" placeholder="NAME">
                <button id="enrollBtn" class="btn enroll-btn">ENROLL</button>
                <button id="testBtn" class="btn test-btn">TEST</button>
                <button id="stopBtn" class="btn stop-btn">STOP</button>
                <button id="recordBtn" class="btn export-btn">Start Recording</button>
            </div>
            
            <div id="dictDisplay" style="font-size: 11px; color: #666; margin-top: 12px; padding-left: 5px;">Slots: [Empty]</div>
            <div id="scoreDisplay" class="score-grid"></div>
        </div>
    </div>

    <script src="../../../serial.js"></script>
    <script>
        let currentMode = 0;
        let userThreshold = 0.80;
        let lastTriggerTimes = [0, 0, 0, 0, 0];
        
        const enrollDict = {};
        const usedIds = new Array(5).fill(false);
        const audioWorker = new Worker('../../../worker.js');
        const SAMPLE_RATE = 16000, TOTAL_SAMPLES = 800 * 320;
        
        let ringBufferL = new Float32Array(TOTAL_SAMPLES), ringBufferR = new Float32Array(TOTAL_SAMPLES);
        let writePtr = 0, rxPtr = 0, rxBuffer = new Uint8Array(8192);
        let queueRaw = [], queueEnh = [], isRecording = false;
        let currentGainFactor = Math.pow(10, 10 / 20.0), connectedPort = null;

        const cRaw = document.getElementById('waveRaw').getContext('2d');
        const cEnh = document.getElementById('waveEnh').getContext('2d');

        // UI Listeners
        document.getElementById('gainSlider').oninput = (e) => {
            const db = parseInt(e.target.value);
            currentGainFactor = Math.pow(10, db / 20.0);
            document.getElementById('gainVal').innerText = (db > 0 ? '+' : '') + db + ' dB';
        };

        document.getElementById('threshSlider').oninput = (e) => {
            userThreshold = (e.target.value / 100).toFixed(2);
            document.getElementById('threshVal').innerText = userThreshold;
        };

        function getTotalEnrolled() { return Object.keys(enrollDict).length; }

        function processPacket(dataView) {
            const type = dataView.getUint8(0);
            if (type === 0x4) {
                const metaOffset = 1284;
                if (dataView.byteLength >= metaOffset + 7) {
                    const utterances = dataView.getInt8(metaOffset);
                    const displayID = dataView.getInt8(metaOffset + 1);
                    document.getElementById('enrollCount').innerText = utterances;

                    if (currentMode === 1 && utterances === 4) {
                        const payload = new Uint8Array([0, 0, 0, 0, 0, 0, getTotalEnrolled()]);
                        connectedPort.send(payload).then(() => {
                            currentMode = 0;
                            document.getElementById('enrollBtn').innerText = "ENROLL";
                            document.getElementById('enrollBtn').classList.remove('enrolling');
                        });
                    }

                    if (displayID === 1) {
                        const scoreDiv = document.getElementById('scoreDisplay');
                        scoreDiv.style.display = 'grid'; 
                        scoreDiv.innerHTML = '';
                        const now = Date.now();

                        for (let i = 0; i < 5; i++) {
                            const rawScore = dataView.getInt8(metaOffset + 2 + i);
                            const score = (rawScore / 128.0).toFixed(2);
                            if (score > userThreshold) lastTriggerTimes[i] = now;
                            const isFlashing = (now - lastTriggerTimes[i]) < 3000;

                            let name = "EMPTY";
                            for (const [k, v] of Object.entries(enrollDict)) { if (v === i) name = k; }

                            scoreDiv.innerHTML += `
                                <div class="score-box ${isFlashing ? 'is-triggering' : ''}">
                                    <span class="score-id">ID ${i}</span>
                                    <span class="score-name">${name}</span>
                                    <span class="score-val" style="color:${isFlashing ? 'var(--red)' : 'var(--text)'}">${score}</span>
                                    ${isFlashing ? '<div class="trigger-badge">TRIGGER</div>' : ''}
                                </div>`;
                        }
                    }
                }
                const left = new Float32Array(320), right = new Float32Array(320);
                for (let i = 0; i < 320; i++) {
                    left[i] = (dataView.getInt16(4 + (i * 4), true) / 32768.0) * currentGainFactor;
                    right[i] = (dataView.getInt16(4 + (i * 4) + 2, true) / 32768.0);
                    let idx = (writePtr + i) % TOTAL_SAMPLES;
                    ringBufferL[idx] = left[i]; ringBufferR[idx] = right[i];
                }
                writePtr = (writePtr + 320) % TOTAL_SAMPLES;
                queueRaw.push(left); queueEnh.push(right);
            }
        }

        document.getElementById('pairButton').onclick = () => {
            serial.requestPort().then(p => p.connect().then(() => {
                connectedPort = p; 
                document.getElementById('status').innerText = "CONNECTED";
                p.onReceive = (data) => {
                    const bytes = new Uint8Array(data.buffer, data.byteOffset, data.byteLength);
                    rxBuffer.set(bytes, rxPtr); rxPtr += bytes.length;
                    while (rxPtr >= 1308) {
                        processPacket(new DataView(rxBuffer.slice(0, 1308).buffer));
                        rxBuffer.set(rxBuffer.subarray(1308, rxPtr), 0); rxPtr -= 1308;
                    }
                };
            }));
        };

        document.getElementById('enrollBtn').onclick = () => {
            const name = document.getElementById('enrollName').value.toUpperCase().trim();
            if (!name) return alert("Enter Name");
            let id = enrollDict[name];
            if (id === undefined) {
                id = usedIds.indexOf(false);
                if (id === -1) return alert("Full");
                enrollDict[name] = id; usedIds[id] = true;
            }
            currentMode = 1;
            const payload = new Uint8Array([0, 0, 0, Math.floor(userThreshold*255), 1, id, getTotalEnrolled()]);
            connectedPort.send(payload);
            document.getElementById('enrollBtn').classList.add('enrolling');
            document.getElementById('enrollBtn').innerText = "ENROLLING";
        };

        document.getElementById('testBtn').onclick = () => {
            currentMode = 2;
            const payload = new Uint8Array([0, 0, 0, Math.floor(userThreshold*255), 2, 0, getTotalEnrolled()]);
            connectedPort.send(payload);
            document.getElementById('testBtn').classList.add('testing');
            document.getElementById('testBtn').innerText = "TESTING";
        };

        document.getElementById('stopBtn').onclick = () => {
            currentMode = 0;
            const payload = new Uint8Array([0, 0, 0, 0, 0, 0, getTotalEnrolled()]);
            connectedPort.send(payload);
            document.getElementById('testBtn').classList.remove('testing');
            document.getElementById('testBtn').innerText = "TEST";
            document.getElementById('enrollBtn').classList.remove('enrolling');
            document.getElementById('enrollBtn').innerText = "ENROLL";
        };

        function draw() {
            [ {c:cRaw, b:ringBufferL, clr:'#FF355E'}, {c:cEnh, b:ringBufferR, clr:'#00d28a'} ].forEach(cfg => {
                cfg.c.fillStyle='#000'; cfg.c.fillRect(0,0,800,120);
                cfg.c.strokeStyle=cfg.clr; cfg.c.beginPath();
                for(let x=0; x<800; x++) {
                    let v = cfg.b[(writePtr + x * 128) % TOTAL_SAMPLES];
                    cfg.c.lineTo(x, 60 + v * 60);
                }
                cfg.c.stroke();
            });
            requestAnimationFrame(draw);
        }
        draw();
    </script>
</body>
</html>
