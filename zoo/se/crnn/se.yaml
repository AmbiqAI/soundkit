name: se_nn_arch72_mel
project: se
job_dir: ./soundkit/tasks/se

data:
  path_tfrecord: ./soundkit/tasks/se/tfrecords
  tfrecord_datalist_name: # list of saved tfrecords
    train: val_tfrecord.csv 
    val: val_tfrecord.csv
  num_samples_per_noise:
    train: 10000
    val: 2500
  force_download: false
  reverb_prob: 0.2
  num_processes: 8
  corpora:
    - {name: train-clean-360, type: speech, split: train}
    - {name: train-clean-100, type: speech, split: train}
    - {name: dev-clean, type: speech, split: val,}
    - {name: thchs30, type: speech, split: train-val}
    - {name: ESC-50-master, type: noise, split: train-val}
    - {name: FSD50K, type: noise, split: train-val}
    - {name: musan, type: noise, split: train-val}
    - {name: wham_noise, type: noise, split: train-val}
    - {name: rirs_noises, type: reverb, split: train-val}
  snr_dbs: [-6, -3, 0, 3, 6, 9, 12, 15, 30] # mixture of signal-to-noise ratios
  target_length_in_secs: 15
  min_amp: 0.01
  max_amp: 0.95

  signal:
    sampling_rate: 16000
    dc_removal: true

  debug: false

train:
  initial_lr: 4e-4
  lr_schedule: cosine
  truncate_time: 8.0  # in seconds, set to null to use full length
  batchsize: 32
  epochs: 150
  warmup_epochs: 5
  epoch_loaded: latest
  loss_function: 
    type: compressed_mse
    params: 
      exp: 0.6
      eps: 1e-8

  path:
    checkpoint_dir: zoo/se/crnn/model
    tensorboard_dir: ./soundkit/tasks/se/tensorboard/${name}
  num_lookahead: 0

  feature: 
    frame_size: 480
    hop_size: 160
    fft_size: 512
    type: mel
    bins: 72
  standardization: true
  
  reset_states_every_batch: true

  model:
    config_dir: zoo/se/crnn
    # config_dir: ./soundkit/models/arch_configs
    config_file: arch_config.yaml
  
  debug: false

evaluate:
  epoch_loaded: 0

  data: 
    dir: "./wavs/se/test_wavs"
    files: [wind_1_90sec_ch0.wav, wind_2_60sec_ch0.wav, wind_3_240sec_ch0.wav, keyboard_steak.wav, i_like_steak.wav, steak_hairdryer.wav]
    # files: [wind_noise.wav, keyboard_steak.wav, i_like_steak.wav, steak_hairdryer.wav]
    result_folder: ${job_dir}/test_results/${name}

export:
  dtype: int16
  eval: false
  qbit_input: 8
  epoch_loaded: 0
  tflite_dir: zoo/se/crnn

demo:
  epoch_loaded: 0
  platform: evb # or pc
  dtype: int16
  calibration_samples: 100
  tflite_dir: ./soundkit/tasks/se/tflite
  # evb_dir: ./soundkit/tasks/se/evb
  evb_dir: ./soundkit/tasks/se/evb_webusb
  
  pre_gain: 1
