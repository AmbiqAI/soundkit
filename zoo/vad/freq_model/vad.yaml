name: crnn
project: vad
job_dir: ./soundkit/tasks/vad

data:
  path_tfrecord: ${job_dir}/tfrecords
  tfrecord_datalist_name: # list of saved tfrecords
    train: train_tfrecord.csv 
    val: val_tfrecord.csv
  num_samples_per_noise:
    train: 10000
    val: 2000
  force_download: false
  reverb_prob: 0.0
  num_processes: 8
  corpora:
    - {name: vad_train-clean-100, type: speech, split: train}
    - {name: vad_train-clean-360, type: speech, split: train}
    - {name: vad_dev-clean, type: speech, split: val}
    - {name: vad_thchs30, type: speech, split: train-val}
    - {name: ESC-50-master, type: noise, split: train-val}
    - {name: FSD50K, type: noise, split: train-val}
    - {name: musan, type: noise, split: train-val}
    - {name: wham_noise, type: noise, split: train-val}
    - {name: rirs_noises, type: reverb, split: train-val}
  snr_dbs: [-6, -3, 0, 3, 6, 9, 12, 15, 30] # mixture of signal-to-noise ratios
  # snr_dbs: [100]
  target_length_in_secs: 15
  min_amp: 0.01
  max_amp: 0.95

  signal:
    sampling_rate: 16000
    dc_removal: true
  debug: false

train:
  initial_lr: 4e-4
  batchsize: 32
  epochs: 300
  warmup_epochs: 5
  epoch_loaded: random
  loss_function: 
    # type: focal
    # params: {gamma: 2.0, alpha: 0.75} # for focal loss
    type: cross_entropy
    params: {}
    
  path:
    full_name: model
    checkpoint_dir:  zoo/vad/freq_model/${train.path.full_name}
    tensorboard_dir: ${job_dir}/tensorboard/${train.path.full_name}
  num_lookahead: 0
  spec_aug: false

  feature:
    frame_size: 480
    hop_size: 160
    fft_size: 512
    type: logpspec
    bins: 257
    # type: hybrid
    # bins_fft: 100
    # n_mels: 72

  standardization: true
  
  model:
    config_dir: ./zoo/vad/freq_model
    config_file: config_crnn_vad.yaml
    override:
      units: 28
      dropout_rate_input: 0.1
      dropout_rate: 0.25
      stride_time: 1
      len_time: 6

  reset_every_batch: true
  debug: false

evaluate:
  epoch_loaded: 0
  eval: true
  data: 
    dir: "./wavs/vad/test_wavs"
    files: [speech.wav, speech_pubNoise.wav]
    result_folder: ${job_dir}/test_results/${train.path.full_name}

export:
  dtype: int16
  epoch_loaded: 0
  tflite_dir: ${job_dir}/tflite

demo:
  platform: pc # evb or pc
  epoch_loaded: 0
  tflite_dir: ${job_dir}/tflite
  evb_dir: ${job_dir}/evb
  pre_gain: 1
  filename: def_nn1_nnvad
  param_struct_name: params_nn1_nnvad
