name: galaxy
project: kws
job_dir: ./soundkit/tasks/${project}

data:
  path_tfrecord: ${job_dir}/tfrecords
  tfrecord_datalist_name: # list of saved tfrecords
    train: train_tfrecord.csv 
    val: val_tfrecord.csv
  num_samples_per_noise:
    train: 757
    val: 177
  force_download: false
  reverb_prob: 0.0
  num_processes: 8
  corpora:
    - {name: train-galaxy, type: speech, split: train}
    - {name: val-galaxy, type: speech, split: val}
    - {name: vad_train-clean-100, type: garbage, split: train}
    - {name: vad_train-clean-360, type: garbage, split: train}
    - {name: vad_dev-clean, type: garbage, split: val}
    - {name: vad_thchs30, type: garbage, split: train-val}
    - {name: ESC-50-master, type: noise, split: train-val}
    - {name: FSD50K, type: noise, split: train-val}
    - {name: musan, type: noise, split: train-val}
    - {name: wham_noise, type: noise, split: train-val}
    - {name: rirs_noises, type: reverb, split: train-val}
  snr_dbs: [-6, -3, 0, 3, 6, 9, 12, 15, 30] # mixture of signal-to-noise ratios
  # snr_dbs: [100]
  target_length_in_secs: 15
  min_amp: 0.01
  max_amp: 0.95

  signal:
    sampling_rate: 16000
    dc_removal: true
  target_frames_extension: 30 # for kws only
  debug: false

train:
  initial_lr: 4e-4
  batchsize: 32
  epochs: 150
  warmup_epochs: 5
  epoch_loaded: random
  loss_function: 
    type: focal # or cross_entropy
    # params: {} # for cross_entropy
    params: 
      gamma: 2.0
      alpha: 0.75 # for focal loss

  path:
    full_name: model
    checkpoint_dir:  zoo/kws/${train.path.full_name}
    tensorboard_dir: ${job_dir}/tensorboard/${train.path.full_name}
  num_lookahead: 0
  
  feature:
    frame_size: 480
    hop_size: 160
    fft_size: 512
    type: logpspec
    bins: 257
    # type: hybrid
    # bins_fft: 100
    # n_mels: 72

  standardization: true
  
  model:
    config_dir: zoo/kws
    config_file: config_crnn_vad.yaml
    override:
      units: 64
      dropout_rate_input: 0.1
      dropout_rate: 0.25
      stride_time: 1
      len_time: 6
  reset_states_every_batch: true
  debug: false

evaluate:
  epoch_loaded: 0

  data: 
    dir: "./wavs/kws/test_wavs"
    files: [galaxy_example.wav, galaxy_counter_example.wav]
    result_folder: ${job_dir}/test_results/${train.path.full_name}

export:
  dtype: int16
  eval: false
  qbit_input: 8
  epoch_loaded: 0
  tflite_dir: zoo/kws

demo:
  platform: pc # evb or pc
  epoch_loaded: 0
  tflite_dir: ${job_dir}/tflite
  evb_dir: ${job_dir}/evb
  pre_gain: 1
  dtype: int16
  filename: def_nn_${project}
  param_struct_name: params_nn_${project}
