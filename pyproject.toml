[project]
name = "soundkit"
version = "0.1.0"
description = "SoundKit CLI tool"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Ambiq AI", email = "support.aitg@ambiq.com"}
]

dependencies = [
    # Core & ML
    "tensorflow[and-cuda]~=2.15.1",
    "tensorboard>=2.15,<2.16",
    "torch>=2.6.0",          # Changed to match current stable
    "torchvision~=0.21.0",   # Downgraded from 0.22 (unreleased)
    "torchaudio~=2.6.0",     # Downgraded from 2.7 (unreleased)
    "torchmetrics~=1.6.0",   # Downgraded from 1.7 (unreleased)

    # Scientific and Data Utilities
    "numpy>=1.21,<2.0",
    "scipy>=1.8,<2.0",
    "pyyaml>=6.0,<7.0",
    "pydantic~=2.10",        # Downgraded from 2.11 (unreleased)
    "argdantic~=1.3",
    "omegaconf~=2.3",
    "tqdm>=4.66,<5.0",
    
    # Explicit build fixes (Prevent compiling from source)
    "h5py>=3.10.0",
    "soxr>=0.3.7",

    # Audio & DSP
    "librosa>=0.9,<0.11",
    "soundfile>=0.10,<1.0",
    "sounddevice>=0.4,<1.0",
    "pyaudio>=0.2.11,<1.0",
    "pesq>=0.0.3,<1.0",
    "pystoi>=0.3.3,<1.0",

    # Visualization & GUI
    "matplotlib>=3.5,<4.0",
    "pyqt5>=5.15,<6.0",

    # Serial communication
    "pyserial~=3.5",

    # ONNX
    "onnxruntime-gpu>=1.16,<2.0",

    # Utilities
    "requests>=2.25,<3.0",

    # Git-based dependency
    "erpc @ git+https://github.com/ambiqai/erpc.git#subdirectory=erpc_python"
]
[project.scripts]
soundkit = "soundkit.cli:main"

[tool.setuptools]
packages = ["soundkit"]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
