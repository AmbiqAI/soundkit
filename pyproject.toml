[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundkit"
version = "0.1.0"
description = "soundKIT CLI tool"
readme = "README.md"
requires-python = ">=3.10,<3.13"
authors = [
  {name = "Ambiq AI", email = "paul.chen@ambiq.com"}
]

dependencies = [
    # Core & ML
    "tensorflow[and-cuda]~=2.15.1",
    "tensorboard>=2.15,<2.16",

    # Scientific and Data Utilities
    "numpy>=1.21,<2.0",
    "scipy>=1.8,<2.0",
    "pyyaml>=6.0,<7.0",
    "pydantic~=2.11",
    "argdantic~=1.3",
    "omegaconf~=2.3",
    "tqdm>=4.66,<5.0",

    # Audio & DSP
    "librosa>=0.9,<0.11",
    "soundfile>=0.10,<1.0",
    "sounddevice>=0.4,<1.0",
    "pyaudio>=0.2.11,<1.0",
    "pesq>=0.0.3,<1.0",
    "pystoi>=0.3.3,<1.0",

    # Visualization & GUI
    "matplotlib>=3.5,<4.0",
    "pyqt5>=5.15,<6.0",

    # Serial communication
    "pyserial~=3.5",

    # ONNX
    "onnxruntime-gpu>=1.16,<2.0",

    # Utilities
    "requests>=2.25,<3.0",
    "boto3>=1.26.0,<2.0",

    # Git-based dependency
    "erpc @ git+https://github.com/ambiqai/erpc.git#subdirectory=erpc_python"
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.5.3,<2.0",
    "mkdocs-material>=9.5.8,<10.0",
    "mkdocs-callouts>=0.3.0",
    "mkdocs-jupyter>=0.24.8,<1.0",
    "pymdown-extensions>=10.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
docs = [
    "mkdocs>=1.5.3,<2.0",
    "mkdocs-material>=9.5.8,<10.0",
    "mkdocs-callouts>=0.3.0",
    "mkdocs-jupyter>=0.24.8,<1.0",
    "pymdown-extensions>=10.0",
    "jinja2>=3.1.0",
]

[project.scripts]
soundkit = "soundkit.cli:main"

[tool.setuptools]
packages = ["soundkit"]

[project.urls]
"Homepage" = "https://github.com/AmbiqAI/soundkit"
