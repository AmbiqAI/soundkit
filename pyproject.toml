[tool.poetry]
name = "soundkit"
version = "0.1.0"
description = "SoundKit CLI tool"
authors = ["Your Name <you@example.com>"]
packages = [{ include = "soundkit" }]

[tool.poetry.dependencies]
python = "^3.10"

# Core dependencies
tensorflow = {version = "2.15.1", extras = ["and-cuda"]}
tensorboard = "*"
numpy = "*"
scipy = "*"
pyyaml = "*"
argparse = "*"
pydantic = "*"
argdantic = "*"
omegaconf = "*"
tqdm = "*"

# Audio & DSP
librosa = "*"
soundfile = "*"
sounddevice = "*"
pyaudio = "*"
pesq = "*"
pystoi = "*"

# Visualization & GUI
matplotlib = "*"
pyqt5 = "*"

# Serial communication
pyserial = "*"

# Torch and related packages
torch = { version = "2.7.0+cu118", source = "pytorch-cu118" }
torchvision = { version = "0.22.0+cu118", source = "pytorch-cu118" }
torchaudio = { version = "2.7.0+cu118", source = "pytorch-cu118" }
torchmetrics = "1.7.1"

# ONNX Runtime
onnxruntime-gpu = "*"

# Misc
requests = "*"

# Git-based dependency
erpc = { git = "https://github.com/ambiqai/erpc.git", subdirectory = "erpc_python", optional = false }

[tool.poetry.scripts]
soundkit = "soundkit.cli:main"

[tool.poetry.source]
# Add PyTorch custom index for CUDA 11.8 builds
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
default = false  # use only for torch packages

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
