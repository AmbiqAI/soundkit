name: crnn
units: 22
len_time: 6
dropout_rate_input: 0.1
dropout_rate: 0.2
stride_time: 1
layer_configs:
  - type: dropout
    rate: ${dropout_rate_input}

  # - type: fc
  #   units: ${units}
  #   activation: tanh

  # - type: dropout
  #   rate: ${dropout_rate}

  - type: conv2d
    filters: ${units}
    kernel_size: ["${len_time}", 22]
    strides: ["${stride_time}", 1]
    activation: tanh

  - type: dropout
    rate: ${dropout_rate}

  - type: lstm
    units: ${units}

  - type: dropout
    rate: ${dropout_rate}

  - type: fc
    units: ${units}
    activation: relu6

  - type: dropout
    rate: ${dropout_rate}

  - type: fc
    units: ${units}
    activation: relu6

  - type: dropout
    rate: ${dropout_rate}

  - type: fc
    units: 2
    activation: linear
