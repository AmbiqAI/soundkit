name: crnn
layer_configs:

  - type: conv2d
    filters: 72
    kernel_size: [6, 72]
    strides: [1, 1]
    activation: prelu

  - type: dropout
    rate: 0.2

  - type: gru
    units: 72

  - type: dropout
    rate: 0.25

  - type: fc
    units: 72
    activation: prelu

  - type: dropout
    rate: 0.25

  - type: fc
    units: 72
    activation: prelu

  - type: dropout
    rate: 0.25

  - type: fc
    units: 257
    activation: dys
