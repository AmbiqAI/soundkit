name: se_ch8_featExp05_gru_linearFeat_uniform_ch_3*3_large_moredata_spDomi_grnn_prelu
project: se
job_dir: ./soundkit/tasks/se

data:
  path_tfrecord: ./soundkit/tasks/se/tfrecords
  tfrecord_datalist_name: # list of saved tfrecords
    # train: train_tfrecord_allLang_uniform.csv 
    # val: val_tfrecord_allLang_uniform.csv
    train: train_tfrecord_all_uniform.csv 
    val: val_tfrecord_all_uniform.csv
  num_samples_per_noise:
    train: 
    val: 
  force_download: false
  reverb_prob: 0.2

  num_processes: 8
  corpora:
    # - {name: train-clean-360, type: speech, split: train-val}
    # - {name: train-clean-100, type: speech, split: train}
    # - {name: dev-clean, type: speech, split: val,}
    # - {name: thchs30, type: speech, split: train-val}
    # - {name: dns_challenge_train, type: speech, split: train}
    # - {name: dns_challenge_val, type: speech, split: val}
    - {name: magicdata-train, type: speech, split: train}
    - {name: magicdata-val, type: speech, split: val}

    # - {name: ESC-50-master, type: noise, split: train-val}
    # - {name: FSD50K, type: noise, split: train-val}
    # - {name: musan, type: noise, split: train-val}
    # - {name: wham_noise, type: noise, split: train-val}
    - {name: dns_challenge_noise, type: noise, split: train-val}
    # - {name: wind_noise, type: noise, split: train-val}
    - {name: rirs_noises, type: reverb, split: train-val}
  snr_dbs: [-9, -6, -3, 0, 3, 6, 9, 12, 15] # mixture of signal-to-noise ratios
  target_length_in_secs: 10.0
  min_amp: 0.01
  max_amp: 0.95
  signal:
    sampling_rate: 16000
    dc_removal: true

  debug: false

train:
  num_per_epoch_files: 
    train: 100000
  truncate_time: 9.5 # in seconds, set to null to use full length
  initial_lr: 4e-4
  lr_schedule: cosine
  batchsize: 32
  epochs: 300
  warmup_epochs: 5
  epoch_loaded: random
  # spec_aug: true
  aec_distort_prob: 0.0  # probability of applying AEC distortion per batch
  reset_states_every_batch: true
  loss_function:

    # type: si_sdr
    # params: 
    #   exp: 0.6
    #   eps: 1e-8

    # type: time_smooth_mae
    # params: 
    #   fft_size: ${train.feature.fft_size}
    #   frame_size: ${train.feature.frame_size}
    #   hop_size: ${train.feature.hop_size}
    #   is_norm: true
    #   eps: 1e-12
    #   power_law_exp: 0.6

    # type: compressed_mse
    # params: 
    #   exp: 0.6
    #   eps: 1e-8

    type: mrl_mse
    params:
      exp: 1.0
      exp_features: ${train.feature.exp_complex}
      eps: 1e-7
      fft_size: ${train.feature.fft_size}
      hop_size: ${train.feature.hop_size}
      frame_size: ${train.feature.frame_size}

    # type: compound_loss
    # params:
    #   losses:
    #     - type: si_sdr
    #       weight: 0.3
    #       params:
    #         eps: 1e-8
    #     - type: mrl_mse
    #       weight: 0.7
    #       params:
    #         exp: 0.6
    #         eps: 1e-8
    #         fft_size: ${train.feature.fft_size}
    #         hop_size: ${train.feature.hop_size}
    #         frame_size: ${train.feature.frame_size}

  path:
    full_name: ${name}_${train.loss_function.type}_${train.feature.type}
    checkpoint_dir: ${job_dir}/models_trained/${train.path.full_name}
    tensorboard_dir: ./soundkit/tasks/se/tensorboard/${train.path.full_name}
  num_lookahead: 2 # the number of future frames to be used. 0: causal, 1: 1-frame lookahead, etc.

  feature: 
    frame_size: 320
    hop_size: 160
    fft_size: 512
    type: erb_complex
    exp_complex: 0.5
    eps: ${train.loss_function.params.eps}
    scale: 1
    bins: 72
    bins_fft: 64
    n_mels: 72
    erb_subband_1: 65 # 97, 80, 65
    erb_subband_2: 64 # 32, 49, 64

  standardization: false
  standardization_type: std
  model:
     config_dir: ./soundkit/models/arch_configs
     config_file: config_unet_relu_complex_erb.yaml
     override:
       bottleneck: dpgrnn
       depthwise_activation: prelu
       kernel_size_time: 2
       kernel_size_freq: 4
       scale_rnn_out: 1.0
      #  normalization_layer: batchnorm_complex
       activation: prelu
       activation_final: dyt
       separable: true
       output_scaling: 1.0
       bypass_last_fc: true
       num_chs: [2, 32, 32, 32, 32]
       dropout: 0.2
  debug: false

evaluate:
  epoch_loaded: 124 # 71
  dtype: float32
  calibration_samples: 20

  data: 
    dir: "./wavs/se/test_wavs"
    # files: [wind4_aecOnly.wav, wind5_aecOnly.wav, keyboard_steak.wav, i_like_steak.wav, steak_hairdryer.wav]
    # files: [test1_aecOnly.wav, test2_aecOnly.wav, test3_aecOnly.wav, test4_aecOnly.wav, test5_aecOnly.wav]
    files: [test4_aecOnly.wav]
    # files: [out1_all.wav, out2_all.wav, out3_all.wav, out4_all.wav, out5_all.wav]
    # files: [keyboard_steak.wav, i_like_steak.wav, steak_hairdryer.wav]
    result_folder: ${job_dir}/test_results/${train.path.full_name}

export:
  dtype: int16
  calibration_samples: 100
  epoch_loaded: 112
  tflite_dir: zoo/se/crnn

demo:
  epoch_loaded: 1
  platform: pc # or pc
  dtype: float32
  calibration_samples: 1
  tflite_dir: ./soundkit/tasks/se/tflite
  evb_dir: ./soundkit/tasks/se/evb_webusb
  
  pre_gain: 1
