name: crnn_experiment
project: se
job_dir: ./soundkit/tasks/se

data:
  path_tfrecord: ${job_dir}/tfrecords
  tfrecord_datalist_name: # list of saved tfrecords
    train: train_tfrecord.csv 
    val: val_tfrecord.csv
  num_samples_per_noise:
    train: 80000
    val: 20000
  force_download: false
  reverb_prob: 0.4
  num_processes: 8
  corpora:
    - {name: train-clean-360, type: speech, split: train}
    - {name: train-clean-100, type: speech, split: train}
    - {name: dev-clean, type: speech, split: val,}
    - {name: thchs30, type: speech, split: train-val}
    - {name: ESC-50-master, type: noise, split: train-val}
    - {name: FSD50K, type: noise, split: train-val}
    - {name: musan, type: noise, split: train-val}
    - {name: wham_noise, type: noise, split: train-val}
    - {name: rirs_noises, type: reverb, split: train-val}
  # snr_dbs: [-6, -3, 0, 3, 6, 9, 12, 15, 30] # mixture of signal-to-noise ratios
  snr_dbs: [100]
  target_length_in_secs: 5
  min_amp: 0.03
  max_amp: 0.95

  signal:
    sampling_rate: 16000
    dc_removal: true
  debug: false

train:
  initial_lr: 4e-4
  batchsize: 128
  epochs: 150
  warmup_epochs: 5
  epoch_loaded: latest
  loss_function: 
    type: mrl_mse
    params: 
      exp: 0.6
      eps: 1e-8
      stft_configs:
        - {"n_fft": 128, "hop_length": 64, "win_length": 128}     # 4ms
        - {"n_fft": 256, "hop_length": 128, "win_length": 256}     # 8ms
        - {"n_fft": 512, "hop_length": 256, "win_length": 512}    # 16ms
        - {"n_fft": 1024, "hop_length": 512, "win_length": 1024}   # 32ms

  path:
    full_name: ${name}_la${train.num_lookahead}_${train.feature.type}_loss-${train.loss_function.type}_reverb-${data.reverb_prob}
    checkpoint_dir:  ${job_dir}/models_trained/${train.path.full_name}
    tensorboard_dir: ${job_dir}/tensorboard/${train.path.full_name}
  num_lookahead: 2
  
  feature:
    frame_size: 128
    hop_size: 64
    fft_size: 128
    type: logampspec
    bins: 65
    # type: hybrid
    # bins_fft: 100
    # n_mels: 72

  standardization: true
  
  model:
    config_dir: ./soundkit/models/arch_configs
    config_file: config_crnn.yaml
  
  debug: false

evaluate:
  epoch_loaded: best

  data: 
    dir: "./wavs/se/test_wavs"
    files: [speech.wav, keyboard_steak.wav, i_like_steak.wav, steak_hairdryer.wav]
    # # dir: ./wavs/LibriSpeech/test-clean
    # # files:
    result_folder: ${job_dir}/test_results/${train.path.full_name}

export:
  epoch_loaded: best
  tflite_dir: ${job_dir}/tflite

demo:
  platform: pc # evb or pc
  epoch_loaded: best
  tflite_dir: ${job_dir}/tflite
  evb_dir: ${job_dir}/evb
  pre_gain: 1
  filename: def_nn3_se
  param_struct_name: params_nn3_se
