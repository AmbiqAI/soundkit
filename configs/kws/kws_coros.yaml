name: coros_morenoises_clean
project: kws
job_dir: ./soundkit/tasks/${project}

data:
  path_tfrecord: ${job_dir}/tfrecords
  tfrecord_datalist_name: # list of saved tfrecords
    train: train_tfrecord.csv 
    val: val_tfrecord.csv
  num_samples_per_noise:
    train: 16166
    val: 569
  force_download: false
  reverb_prob: 0.3
  num_processes: 8
  corpora:
    - {name: train-coros, type: speech, split: train}
    - {name: val-coros, type: speech, split: val}
    - {name: vad_train-clean-100, type: garbage, split: train}
    - {name: vad_train-clean-360, type: garbage, split: train}
    - {name: vad_dev-clean, type: garbage, split: val}
    - {name: vad_thchs30, type: garbage, split: train-val}
    - {name: ESC-50-master, type: noise, split: train-val}
    - {name: FSD50K, type: noise, split: train-val}
    - {name: musan, type: noise, split: train-val}
    - {name: wham_noise, type: noise, split: train-val}
    - {name: dns_challenge, type: noise, split: train-val}
    - {name: rirs_noises, type: reverb, split: train-val}
  snr_dbs: [-6, -3, 0, 3, 6, 9, 12, 15] # mixture of signal-to-noise ratios
  # snr_dbs: [100]
  target_length_in_secs: 15
  min_amp: 0.03
  max_amp: 0.95

  signal:
    sampling_rate: 16000
    dc_removal: true
  target_frames_extension: 40 # for kws only
  debug: false

train:
  initial_lr: 4e-4
  lr_schedule: cosine
  batchsize: 64
  epochs: 150
  warmup_epochs: 5
  epoch_loaded: random
  loss_function: 
    type: focal # or cross_entropy/focal
    # params: {} # for cross_entropy
    params: 
      gamma: 2.0
      alpha: 0.75 # for focal loss

  path:
  
    checkpoint_dir:  ${job_dir}/models_trained/${name}_${train.loss_function.type}
    tensorboard_dir: ${job_dir}/tensorboard/${name}_${train.loss_function.type}
  num_lookahead: 0
  
  feature:
    frame_size: 480
    hop_size: 160
    fft_size: 512
    type: mel
    bins: 72
    # type: hybrid
    # bins_fft: 100
    # n_mels: 72

  standardization: true
  
  model:
    config_dir: ./soundkit/models/arch_configs
    config_file: config_crnn_vad.yaml
    override:
      units: 64
      dropout_rate_input: 0.0
      dropout_rate: 0.25
      stride_time: 1
      len_time: 6
  reset_states_every_batch: true
  debug: false

evaluate:
  epoch_loaded: best

  data: 
    dir: "./wavs/kws/test_wavs"
    files: [galaxy_example.wav, galaxy_counter_example.wav]
    result_folder: ${job_dir}/test_results/${name}_${train.loss_function.type}

export:
  dtype: int16
  eval: false
  qbit_input: 8
  epoch_loaded: best
  tflite_dir: ${job_dir}/tflite

demo:
  platform: pc # evb or pc
  epoch_loaded: best
  tflite_dir: ${job_dir}/tflite
  evb_dir: ${job_dir}/evb
  pre_gain: 1
  filename: def_nn_${project}
  param_struct_name: params_nn_${project}
